rules:
  proposal:
    - State the roadmap position and which earlier changes this change depends on in Impact
    - State explicitly what is out of scope
  specs:
    - Use the glossary terms from the project context exactly
    - Every requirement uses SHALL or MUST and states one observable behaviour
    - Reference the owning capability instead of restating its behaviour
    - Name any policy key a requirement depends on as policy.<path>, for example policy.tools.shell.mode
    - Do not name libraries, classes or file layouts in specs; put them in design.md
  design:
    - List the alternatives considered for every decision
    - Every risk has a mitigation, written as "[Risk] -> Mitigation"
    - Quantify performance on the baseline hardware (i5, 16 GB, iGPU, CPU-only ML) where relevant
  tasks:
    - Start with a validation-spike group whenever the change depends on an unproven assumption
    - Each task states how it is verified
    - Each group lands its own tests (unit tests, plus fuzz tests for parsers of untrusted input)

operations:
  apply:
    guidance:
      - Read the relevant specs under openspec/specs and the change's delta specs before writing code
      - If implementation reveals a spec gap or conflict, update the change's specs first, then the code
  archive:
    guidance:
      - Archive only after all tasks are checked and openspec validate --all --strict passes
      - After archiving, check that the merged main specs still read coherently
