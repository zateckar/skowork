# Release (add-client-foundation task 2.4): a version tag publishes two artifacts:
#   - the control plane as a container image on GitHub Container Registry,
#   - the desktop client as a zip package with its SHA-256 checksum, attached to the GitHub release,
#     with optional Local apps and speech runtime packages next to it.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.7z
  WINLIBS_SHA256: 53fb6773fbdf87cdf22b69a6b2a07ee33d3ada413b42d83044bc7cc6481400d2

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag $GITHUB_REF_NAME"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ "$v" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  policy-coverage:
    name: Policy catalog and schema coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - run: npm run policy:schema -- --check
      - run: node --test test/policy-tool-catalog.test.ts test/policy-tool-decision.test.ts

  control-plane-image:
    name: Control plane container image
    runs-on: ubuntu-latest
    needs: [version, policy-coverage]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workbench-control-plane
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ needs.version.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=SkoWork control plane
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          provenance: true
          sbom: true

  desktop-zip:
    name: Desktop client zip
    runs-on: windows-latest
    needs: [version, policy-coverage]
    env:
      HAS_SIGNING_CERT: ${{ secrets.WORKBENCH_SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install WinLibs (pinned, verified)
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.7z'
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WINLIBS_SHA256) { throw 'WinLibs hash mismatch' }
          7z x $archive "-o$env:RUNNER_TEMP\winlibs" -y | Out-Null
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\winlibs\mingw64\bin"
      - name: Fetch the app runtime (pinned Node.js, SHA-256 and signature checked)
        shell: pwsh
        run: ./dev/scripts/fetch-node-runtime.ps1
      - name: Release build and package checks
        shell: pwsh
        working-directory: client
        run: |
          cmake --preset release -DWORKBENCH_TESTS=OFF '-DWORKBENCH_VERSION=${{ needs.version.outputs.version }}' '-DWORKBENCH_COMMIT=${{ github.sha }}'
          cmake --build --preset release
          ./tools/check-manifests.ps1 -BuildDir build/release
          ./tools/check-footprint.ps1 -BuildDir build/release
      - name: Sign executables (when a code-signing certificate is configured)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WORKBENCH_SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WORKBENCH_SIGNING_CERT_PASSWORD }}
        working-directory: client
        run: ./tools/sign.ps1 -BuildDir build/release
      - name: Package
        shell: pwsh
        working-directory: client
        run: ./tools/package.ps1 -BuildDir build/release -OutDir build/package -Version '${{ needs.version.outputs.version }}'
      - name: Fetch pinned speech assets
        shell: pwsh
        run: ./dev/scripts/fetch-stt-models.ps1
      - name: Build and verify optional speech package
        shell: pwsh
        working-directory: client
        run: ./tools/package-speech.ps1 -OutDir build/package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-zip
          path: |
            client/build/package/*.zip
            client/build/package/*.zip.sha256

  publish:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [version, control-plane-image, desktop-zip]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-zip
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: SkoWork ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          files: |
            dist/*.zip
            dist/*.zip.sha256
          body: |
            Desktop client: `SkoWork-${{ needs.version.outputs.version }}-win-x64.zip` (checksum in the `.sha256` file).
            Optional app runtime for Local apps: `SkoWork-${{ needs.version.outputs.version }}-app-runtime-win-x64.zip`, extracted next to SkoWork.exe.
            Optional speech runtime and models: `SkoWork-speech-v1-win-x64.zip` (checksum in the `.sha256` file), downloaded by clients from the address and SHA-256 set in policy (speech.package.*), or imported in SkoWork's speech setup.
            Control plane image: `ghcr.io/${{ github.repository_owner }}/workbench-control-plane:${{ needs.version.outputs.version }}`.
