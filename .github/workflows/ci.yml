# Continuous integration (add-client-foundation tasks 2.2, 2.3, 2.5; design D9). Every push to main that passes
# publishes a dev build: the control plane image (tagged with the dev version and `main`) and the desktop packages on the
# rolling `dev` pre-release. Pull requests publish nothing. Version tags are released by release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main may be publishing: let it finish. The queue keeps only the newest pending run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OPENSPEC_TELEMETRY: '0'
  # Pinned toolchain (design D2a): WinLibs GCC 16.2.0 + MinGW-w64 14.0.0 (UCRT), with CMake and Ninja.
  WINLIBS_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.7z
  WINLIBS_SHA256: 53fb6773fbdf87cdf22b69a6b2a07ee33d3ada413b42d83044bc7cc6481400d2

jobs:
  version:
    name: Build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the release tags
      - id: v
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # The patch after the last release tag (pre-release tags excluded), as a dev pre-release of it.
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || echo v0.0.0)
            IFS=. read -r major minor patch <<< "${last#v}"
            version="$major.$minor.$((patch + 1))-dev.$GITHUB_RUN_NUMBER"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]] || { echo "bad version $version (from $last)"; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"

  specs:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @fission-ai/openspec@latest validate --all --strict

  client-windows:
    name: Client (Windows, GCC/MinGW)
    runs-on: windows-latest
    needs: version
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      VERSION: ${{ needs.version.outputs.version }}
      HAS_SIGNING_CERT: ${{ secrets.WORKBENCH_SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain cache
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/winlibs
          key: winlibs-${{ env.WINLIBS_SHA256 }}
      - name: Install WinLibs (pinned, verified)
        if: steps.toolchain.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'winlibs.7z'
          Invoke-WebRequest $env:WINLIBS_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:WINLIBS_SHA256) { throw "WinLibs hash mismatch: $hash" }
          7z x $archive "-o$env:RUNNER_TEMP\winlibs" -y | Out-Null
      - name: Put the toolchain first on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\winlibs\mingw64\bin"
      - name: Fetch the app runtime for the client/local-apps tests (pinned Node.js, SHA-256 and signature checked)
        shell: pwsh
        run: ./dev/scripts/fetch-node-runtime.ps1
      - name: Display large enough for the desktop tests (the runner starts at 1024x768)
        shell: pwsh
        run: ./dev/scripts/ci-display.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '26'  # dev/graph-mock runs its TypeScript directly
      - name: MCP reference server for the client/mcp-client tests (dev-only, never shipped)
        shell: pwsh
        working-directory: dev/mcp-test-server
        run: npm ci
      - name: Graph mock for the client/mail-calendar tests (dev-only, never shipped)
        shell: pwsh
        working-directory: dev/graph-mock
        run: npm ci
      # Release preset only, to keep the job short (add-client-foundation design D9): the debug build with the UBSan
      # trap and -fanalyzer run locally; undefined behaviour in the portable libraries is covered by the Linux job.
      - name: Release build (warnings as errors)
        shell: pwsh
        working-directory: client
        run: |
          g++ --version | Select-Object -First 1
          # The published dev build reports its version and the dev channel; the tests run against that same build.
          $publish = if ($env:PUBLISH -eq 'true') { @("-DWORKBENCH_VERSION=$env:VERSION", '-DWORKBENCH_CHANNEL=dev') } else { @() }
          cmake --preset release '-DWORKBENCH_COMMIT=${{ github.sha }}' @publish
          cmake --build --preset release
      - name: Unit tests
        shell: pwsh
        working-directory: client
        run: ctest --preset release -LE e2e
      - name: Keep the images of failed golden tests
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force golden-actual | Out-Null
          Copy-Item "$env:TEMP\*.actual.png" golden-actual -ErrorAction SilentlyContinue
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: golden-actual
          if-no-files-found: ignore
      - name: Sign executables (dev build, when a code-signing certificate is configured)
        if: env.PUBLISH == 'true' && env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          SIGNING_CERT: ${{ secrets.WORKBENCH_SIGNING_CERT_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WORKBENCH_SIGNING_CERT_PASSWORD }}
        working-directory: client
        run: ./tools/sign.ps1 -BuildDir build/release
      - name: Package and footprint check
        shell: pwsh
        working-directory: client
        run: |
          ./tools/package.ps1 -BuildDir build/release -OutDir build/package -Version $env:VERSION
          ./tools/check-footprint.ps1 -BuildDir build/release
      - name: Keep the dev build packages
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-zip-${{ needs.version.outputs.version }}
          if-no-files-found: error
          path: |
            client/build/package/*.zip
            client/build/package/*.zip.sha256
  portable-sanitizers:
    name: Portable libraries (Linux, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test under sanitizers
        working-directory: client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build g++-14
          cmake --preset sanitize -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          cmake --build --preset sanitize
          ctest --preset sanitize

  fuzz:
    name: Fuzz untrusted-input parsers (Linux, libFuzzer, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build fuzz targets
        working-directory: client
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build clang-18 libclang-rt-18-dev
          cmake --preset fuzz-libfuzzer -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build --preset fuzz-libfuzzer
      - name: Fuzz each target for two minutes
        working-directory: client
        run: |
          mkdir -p build/corpus/tool_args build/corpus/sse build/corpus/markdown build/corpus/telemetry_redaction build/corpus/meeting_container
          ./build/fuzz-libfuzzer/fuzz/fuzz_tool_args build/corpus/tool_args fuzz/corpus/tool_args \
            -dict=fuzz/corpus/tool_args.dict -max_len=65536 -max_total_time=120 -timeout=2 -artifact_prefix=build/
          ./build/fuzz-libfuzzer/fuzz/fuzz_sse build/corpus/sse tests/model/fixtures \
            -dict=fuzz/corpus/sse.dict -max_len=65536 -max_total_time=120 -timeout=2 -artifact_prefix=build/
          ./build/fuzz-libfuzzer/fuzz/fuzz_markdown build/corpus/markdown fuzz/corpus/markdown \
            -dict=fuzz/corpus/markdown.dict -max_len=8192 -max_total_time=120 -timeout=2 -artifact_prefix=build/
          ./build/fuzz-libfuzzer/fuzz/fuzz_telemetry_redaction build/corpus/telemetry_redaction fuzz/corpus/telemetry_redaction \
            -dict=fuzz/corpus/telemetry_redaction.dict -max_len=20000 -max_total_time=120 -timeout=2 -artifact_prefix=build/
          ./build/fuzz-libfuzzer/fuzz/fuzz_meeting_container build/corpus/meeting_container fuzz/corpus/meeting_container \
            -dict=fuzz/corpus/meeting_container.dict -max_len=8192 -max_total_time=120 -timeout=2 -artifact_prefix=build/
      - name: Keep a crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: client/build/crash-*

  control-plane:
    name: Control plane (Node.js, SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Telemetry allowlists match telemetry/catalogue.yaml
        run: npm run telemetry:catalogue -- --check
      - name: Tests (in-test issuer and upstream fakes; no organization services, no secrets)
        run: npm test
      - name: Admin console builds
        run: npm run admin:build
      - name: Container image builds
        run: docker build -t workbench-control-plane:ci .

  graph-mock:
    name: Graph mock (dev/graph-mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dev/graph-mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: dev/graph-mock/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Single executable, ready within 5 seconds
        run: npm run build:sea
      - name: Container image builds and is ready within 5 seconds
        run: |
          docker build -t workbench-graph-mock:ci .
          docker run -d --name graph-mock -p 4810:4810 -p 4811:4811 workbench-graph-mock:ci
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4811/_mock/health && exit 0; sleep 0.1; done
          docker logs graph-mock; exit 1

  # ---- Dev build (design D9 Published artifacts): only on a push to main, only when every job above passed. ----

  publish-image:
    name: Publish the control plane image (dev build)
    runs-on: ubuntu-latest
    needs: [version, specs, client-windows, portable-sanitizers, fuzz, control-plane, graph-mock]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/workbench-control-plane
          # Never `latest`: that tag belongs to the stable releases (release.yml).
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.title=Workbench control plane
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: control-plane
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          provenance: true
          sbom: true

  publish-packages:
    name: Publish the desktop packages (dev pre-release)
    runs-on: ubuntu-latest
    needs: [version, specs, client-windows, portable-sanitizers, fuzz, control-plane, graph-mock]
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-zip-${{ needs.version.outputs.version }}
          path: dist
      - name: Replace the rolling dev pre-release
        run: |
          ls -l dist
          notes=$(cat <<EOF
          Dev build $VERSION of main at ${GITHUB_SHA::12}, replaced by every change on main that passes CI. Channel: dev.

          Desktop client: \`Workbench-$VERSION-win-x64.zip\` (checksum in the \`.sha256\` file).
          Optional app runtime for Local apps: \`Workbench-$VERSION-app-runtime-win-x64.zip\`, extracted next to Workbench.exe.
          Control plane image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/workbench-control-plane:$VERSION\` (also \`:main\`).
          EOF
          )
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          # A `dev` tag left without its release would pin the new release to the old commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/dev" 2>/dev/null || true
          gh release create dev dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Workbench $VERSION (dev)" --notes "$notes"
# Not in CI on purpose (design D12): the client end-to-end tests and the control plane's real-LLM tests use the
# organization Keycloak test realm and the organization LLM API from a developer's .env. They run locally only; the API key
# is never stored as a repository or Actions secret.